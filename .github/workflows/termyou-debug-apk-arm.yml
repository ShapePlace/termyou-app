name: Build Termyou Debug APK (ARM)

on:
  workflow_dispatch:
    inputs:
      bootstrap_run_id:
        description: "GitHub Actions run ID containing termyou-bootstrap-arm-experimental"
        required: true
        default: "44295108785"
      expected_bootstrap_sha256:
        description: "Expected SHA-256 of output/bootstrap-arm.zip"
        required: true
        default: "49292dabea9951e9b33fc72417c7c32e82c6017b1d1ab1513e4d3823dd1ef186"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download and verify experimental ARM bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_RUN_ID: ${{ inputs.bootstrap_run_id }}
          EXPECTED_SHA256: ${{ inputs.expected_bootstrap_sha256 }}
        run: |
          set -euo pipefail
          rm -rf /tmp/termyou-bootstrap-dl
          mkdir -p /tmp/termyou-bootstrap-dl
          gh run download "$BOOTSTRAP_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "termyou-bootstrap-arm-experimental" \
            --dir /tmp/termyou-bootstrap-dl

          ZIP_PATH="/tmp/termyou-bootstrap-dl/output/bootstrap-arm.zip"
          test -f "$ZIP_PATH"
          ACTUAL_SHA256="$(sha256sum "$ZIP_PATH" | awk '{print $1}')"
          echo "Downloaded bootstrap SHA-256: $ACTUAL_SHA256"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: Bootstrap SHA-256 mismatch! Expected $EXPECTED_SHA256, got $ACTUAL_SHA256" >&2
            exit 1
          fi

          mkdir -p app/src/main/cpp
          cp "$ZIP_PATH" app/src/main/cpp/bootstrap-arm.zip
          sha256sum app/src/main/cpp/bootstrap-arm.zip

      - name: Build Termyou armeabi-v7a Debug APK
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMYOU_CUSTOM_BOOTSTRAP_ARM_SHA256: ${{ inputs.expected_bootstrap_sha256 }}
        run: |
          set -euo pipefail
          CURRENT_VERSION_NAME_REGEX='\s+versionName "([^"]+)"$'
          CURRENT_VERSION_NAME="$(grep -m 1 -E "$CURRENT_VERSION_NAME_REGEX" ./app/build.gradle | sed -r "s/$CURRENT_VERSION_NAME_REGEX/\1/")"
          RELEASE_VERSION_NAME="v$CURRENT_VERSION_NAME+${GITHUB_SHA:0:7}"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME-apt-android-7-termyou-debug"
          export TERMUX_APP_VERSION_NAME="${RELEASE_VERSION_NAME/v/}"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"

          ./gradlew assembleDebug

          APK_DIR_PATH="./app/build/outputs/apk/debug"
          APK_PATH="$APK_DIR_PATH/termux-app_${APK_VERSION_TAG}_armeabi-v7a.apk"
          test -f "$APK_PATH"
          (cd "$APK_DIR_PATH" && sha256sum "termux-app_${APK_VERSION_TAG}_armeabi-v7a.apk" > "termyou-debug-armeabi-v7a.sha256")
          echo "APK_DIR_PATH=$APK_DIR_PATH" >> "$GITHUB_ENV"
          echo "APK_FILE=termux-app_${APK_VERSION_TAG}_armeabi-v7a.apk" >> "$GITHUB_ENV"

      - name: Upload Termyou Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: termyou-debug-apk-armeabi-v7a
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_FILE }}
            ${{ env.APK_DIR_PATH }}/termyou-debug-armeabi-v7a.sha256
            ${{ env.APK_DIR_PATH }}/output-metadata.json
          retention-days: 7
