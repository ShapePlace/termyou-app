name: Termyou experimental ARM bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out Termux package sources
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: 4d69490e5b9526ccbef2bd18a026061f6d06ba95
          path: termux-packages
          persist-credentials: false

      - name: Set the Termyou package name
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/properties.sh')
          text = path.read_text()
          original = 'TERMUX_APP__PACKAGE_NAME="com.termux"'
          replacement = 'TERMUX_APP__PACKAGE_NAME="com.termyou"'
          if text.count(original) != 1:
              raise SystemExit('Expected exactly one package-name assignment; aborting.')
          path.write_text(text.replace(original, replacement, 1))

          # bzip2 is a subpackage of libbz2, not a standalone source recipe.
          bootstrap = Path('scripts/build-bootstraps.sh')
          text = bootstrap.read_text()
          original = 'PACKAGES+=("bzip2")'
          replacement = 'PACKAGES+=("libbz2")'
          if text.count(original) != 1:
              raise SystemExit('Expected exactly one bzip2 entry; aborting.')
          text = text.replace(original, replacement, 1)

          # Fail the build if archive creation or its final move fails.
          old_archive = '\t\tzip -r9 "${BOOTSTRAP_TMPDIR}/bootstrap-${1}.zip" ./*\n\t)\n\n\tmv -f "${BOOTSTRAP_TMPDIR}/bootstrap-${1}.zip" "$TERMUX_PACKAGES_DIRECTORY/"\n'
          new_archive = '\t\tzip -r9 "${BOOTSTRAP_TMPDIR}/bootstrap-${1}.zip" ./*\n\t) || return $?\n\n\tmv -f "${BOOTSTRAP_TMPDIR}/bootstrap-${1}.zip" "$TERMUX_PACKAGES_DIRECTORY/" || return $?\n'
          if text.count(old_archive) != 1:
              raise SystemExit('Could not find the expected archive commands; aborting.')
          bootstrap.write_text(text.replace(old_archive, new_archive, 1))
          PY
          grep -Fx 'TERMUX_APP__PACKAGE_NAME="com.termyou"' scripts/properties.sh
          git rev-parse HEAD

      - name: Build ARM bootstrap (experimental)
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          # This is an isolated checkout on the temporary GitHub runner.
          # The container's builder must be able to write the final ZIP here.
          chmod a+rwx .
          ./scripts/run-docker.sh sh -c 'touch /home/builder/termux-packages/.termyou-write-test && rm /home/builder/termux-packages/.termyou-write-test'
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures arm

      - name: Check archive and record build information
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s bootstrap-arm.zip ]; then
            echo 'ERROR: bootstrap-arm.zip is missing or empty' >&2
            ls -la
            exit 1
          fi
          if ! unzip -t bootstrap-arm.zip > unzip-test.log 2>&1; then
            echo 'ERROR: ZIP integrity check failed' >&2
            tail -n 50 unzip-test.log >&2
            exit 1
          fi
          echo 'ZIP integrity check passed.'
          unzip -Z1 bootstrap-arm.zip > archive-files.txt
          if ! grep -Eq '^(\./)?bin/bzip2$' archive-files.txt; then
            echo 'ERROR: bootstrap archive does not contain bin/bzip2' >&2
            exit 1
          fi
          sha256sum bootstrap-arm.zip > SHA256SUMS.txt
          {
            echo 'Experimental bootstrap; not an APK and not device-tested.'
            echo 'Target package: com.termyou'
            echo 'Target architecture: arm (armeabi-v7a)'
            echo "termux-packages commit: $(git rev-parse HEAD)"
            echo "Builder image ID: $(docker image inspect ghcr.io/termux/package-builder --format '{{.Id}}')"
          } > BUILD-INFO.txt

      - name: Upload bootstrap artifact (including for diagnostics if validation fails)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: termyou-bootstrap-arm-experimental
          path: |
            termux-packages/bootstrap-arm.zip
            termux-packages/SHA256SUMS.txt
            termux-packages/BUILD-INFO.txt
          if-no-files-found: warn
          retention-days: 7
